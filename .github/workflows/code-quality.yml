name: Code Quality

on:
  push:
    branches:
      - "release/**"
  pull_request:
    # will run on the following merges:
    # [ feature/* -> dev, dev -> release/*, release/* -> master, hotfix/* -> master ]
    branches:
      - master
      - dev
      - "release/**"
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the exact Node.js version used across every job for reproducibility
  NODE_VERSION: "24.13.0"

permissions:
  contents: read
  security-events: write # required for CodeQL/Trivy SARIF upload
  actions: read
  pull-requests: read

jobs:
  # ---------------------------------------------------------------------
  # 0. GitFlow branch policy
  # ---------------------------------------------------------------------
  gitflow:
    name: GitFlow branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR or release branch
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
            head="${{ github.head_ref }}"

            case "$base:$head" in
              dev:feature/*|release/*:dev|master:release/*|master:hotfix/*)
                echo "Allowed GitFlow path: $head -> $base"
                ;;
              *)
                echo "::error::Invalid GitFlow path: $head -> $base"
                echo "Allowed: feature/* -> dev, dev -> release/*, release/* -> master, hotfix/* -> master"
                exit 1
                ;;
            esac
          elif [ "${{ github.event_name }}" = "push" ]; then
            ref="${{ github.ref_name }}"

            case "$ref" in
              release/*)
                echo "Release branch CI enabled for $ref"
                ;;
              *)
                echo "::error::Unexpected push ref for this workflow: $ref"
                exit 1
                ;;
            esac
          fi

  # ---------------------------------------------------------------------
  # 1. Installation + lockfile consistency
  # ---------------------------------------------------------------------
  install:
    name: Install & verify lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies (frozen lockfile)
        run: npm ci

      - name: Verify lockfile consistency
        run: npm ci --dry-run

  # ---------------------------------------------------------------------
  # 2. Formatting
  # ---------------------------------------------------------------------
  format:
    name: Prettier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Check formatting
        run: npm run format:check

  # ---------------------------------------------------------------------
  # 3. Linting, code smells, and TypeScript strictness
  # ---------------------------------------------------------------------
  lint:
    name: ESLint (strict + security + complexity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run ESLint
        run: npx eslint . --max-warnings=0

  # ---------------------------------------------------------------------
  # 4. Type safety
  # ---------------------------------------------------------------------
  typecheck:
    name: TypeScript (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------
  # 5. Build
  # ---------------------------------------------------------------------
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    needs: [format, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  # ---------------------------------------------------------------------
  # 6. Tests + coverage
  # ---------------------------------------------------------------------
  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test:coverage
      - name: Enforce coverage thresholds
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const req = { lines: 80, statements: 80, functions: 80, branches: 70 };
            let fail = false;
            for (const k of Object.keys(req)) {
              if (s[k].pct < req[k]) {
                console.error('Coverage for ' + k + ' is ' + s[k].pct + '%, below required ' + req[k] + '%');
                fail = true;
              }
            }
            if (fail) process.exit(1);
          "
      - name: Publish coverage metrics
        run: |
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const rows = Object.entries(s).map(([k, v]) => '| ' + k + ' | ' + v.pct + '% | ' + v.covered + '/' + v.total + ' |');
            const summary = ['## Coverage metrics', '', '| Metric | Coverage | Covered/Total |', '| --- | ---: | ---: |', ...rows].join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary + '\n');
          "
      - name: Upload coverage reports (HTML/JSON/LCOV)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/lcov-report/**
            coverage/coverage-final.json
            coverage/coverage-summary.json
            coverage/lcov.info
          retention-days: 14

  # ---------------------------------------------------------------------
  # 7. Duplicate code
  # ---------------------------------------------------------------------
  duplication:
    name: Duplicate code warning < 3% (jscpd)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run jscpd (warn above 3% duplication)
        run: npm run duplication

  # ---------------------------------------------------------------------
  # 8. Unused code and dependencies
  # ---------------------------------------------------------------------
  unused:
    name: Unused files/exports/deps (knip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Run knip
        run: npm run unused

  # ---------------------------------------------------------------------
  # 8b. Technical debt metric
  # ---------------------------------------------------------------------
  tech-debt:
    name: Technical debt comments
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Measure TODO/FIXME density
        run: npm run tech-debt

  # ---------------------------------------------------------------------
  # 9. Dependency vulnerabilities
  # ---------------------------------------------------------------------
  audit:
    name: npm audit (prod deps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - name: Audit production dependencies
        run: npm run audit:prod

  # ---------------------------------------------------------------------
  # 10. Secret scanning
  # ---------------------------------------------------------------------
  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"
          GITLEAKS_ENABLE_SUMMARY: "true"

  # ---------------------------------------------------------------------
  # 11. Static security analysis
  #     This job runs Semgrep as a local, license-free
  #     fallback so SAST still runs on private repos without Advanced Security.
  # ---------------------------------------------------------------------

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config auto --error .

  # ---------------------------------------------------------------------
  # 12. Container scanning (only if a Dockerfile exists)
  # ---------------------------------------------------------------------
  container-scan:
    name: Docker image scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Check for Dockerfile
        id: dockerfile
        run: |
          if [ -f Dockerfile ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        if: steps.dockerfile.outputs.exists == 'true'
        run: docker build -t frontend:ci .

      - name: Scan image with Trivy
        if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "frontend:ci"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
