name: Accessibility

on:
  pull_request:
    branches:
      - master
      - dev
      - "release/**"
  workflow_dispatch:

concurrency:
  group: frontend-a11y-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    name: Accessibility scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.13.0"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run accessibility check
        run: npm run a11y:check

      - name: Upload accessibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: a11y-artifacts/**
          retention-days: 14

      - name: Post PR summary comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const summaryPath = path.join(process.cwd(), 'a11y-artifacts', 'summary.json');

            let body = '### Accessibility check failed\n\nNo accessibility results were found.';

            if (fs.existsSync(summaryPath)) {
              const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'));
              const counts = { critical: 0, serious: 0, moderate: 0, minor: 0 };

              for (const route of summary.routes || []) {
                for (const violation of route.violations || []) {
                  const impact = (violation.impact || 'moderate').toLowerCase();
                  if (counts[impact] !== undefined) {
                    counts[impact] += 1;
                  }
                }
              }

              const routeLines = (summary.routes || [])
                .map((route) => `- \`${route.route}\`: ${route.violationCount} ${route.violationCount === 1 ? 'issue' : 'issues'}`)
                .join('\n');

              body = `### Accessibility check failed\n\nThe automated accessibility scan found issues that should be fixed before merge.\n\n### Route summary\n\n${routeLines}\n\n**Total:** ${summary.totals?.violations ?? 0} accessibility violations across ${summary.totals?.pagesScanned ?? 0} pages\n\n| Severity | Count |\n| --- | ---: |\n| Critical | ${counts.critical} |\n| Serious | ${counts.serious} |\n| Moderate | ${counts.moderate} |\n| Minor | ${counts.minor} |\n\n⚠️ This check fails on any accessibility issue, so this PR is currently blocked.\n\nArtifacts are available in the workflow run output and the uploaded \`a11y-report\` artifact.`;
            }

            const pr = context.payload.pull_request;
            if (pr) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body,
              });
            } else {
              core.info(body);
            }
