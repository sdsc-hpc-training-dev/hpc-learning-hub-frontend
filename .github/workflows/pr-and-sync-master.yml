name: "Master: PR Gates & Sync to Dev"

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened]
  push:
    branches:
      - master

concurrency:
  group: master-pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.13.0"

permissions:
  contents: write
  security-events: write
  actions: read
  pull-requests: read

jobs:
  validate-branch:
    name: Validate Source Branch
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Ensure PR source branch is release/* or hotfix/*
        run: |
          HEAD_REF="${{ github.head_ref }}"
          echo "PR Head: $HEAD_REF"
          if [[ ! "$HEAD_REF" =~ ^release/ ]] && [[ ! "$HEAD_REF" =~ ^RELEASE- ]] && [[ ! "$HEAD_REF" =~ ^hotfix/ ]]; then
            echo "::error::Only PRs coming from 'release/*' or 'hotfix/*' branches are allowed into 'master'."
            exit 1
          fi

  install:
    name: Install & verify lockfile
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci

  format:
    name: Prettier
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx prettier --write .

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx eslint . --max-warnings=0

  typecheck:
    name: TypeScript (tsc --noEmit)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx tsc --noEmit

  build:
    name: Next.js build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch, format, lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm run test:coverage

  duplication:
    name: Duplicate code (jscpd)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx jscpd . --config .jscpd.json

  unused:
    name: Unused code (knip)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npx knip

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    name: Secret scanning (Gitleaks)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch]
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config auto
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  container-scan:
    name: Docker image scan (Trivy)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: [validate-branch, build]
    steps:
      - uses: actions/checkout@v4
      - id: dockerfile
        run: |
          if [ -f Dockerfile ]; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.dockerfile.outputs.exists == 'true'
        run: docker build -t frontend:ci .
      - if: steps.dockerfile.outputs.exists == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "frontend:ci"
          format: "table"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

  sync-master-to-dev:
    name: Auto-merge Master into Dev
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Master to Dev
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin dev
          git checkout dev
          git merge origin/master --no-ff -m "chore: sync master to dev [skip ci]"
          git push origin dev